name: Release

# Packaging runs on a tag, and can be dry-run by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------
  # Debian / Ubuntu / Mint .deb and Fedora / RHEL / openSUSE .rpm are built
  # on the oldest sensible glibc so the binary runs on newer systems too.
  # ---------------------------------------------------------------------
  deb-rpm:
    name: .deb and .rpm
    # 24.04 is the floor: the GTK4 bindings we enable need GTK >= 4.12 and
    # libadwaita >= 1.5, which 22.04 (4.6 / 1.1) cannot provide.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-4-dev libadwaita-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install packagers
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - name: Build
        run: cargo build --release

      - name: Build .deb
        run: cargo deb -p snatch-gui --no-build --output dist/

      - name: Build .rpm
        run: |
          mkdir -p dist
          cargo generate-rpm -p snatch-gui --output dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*

  # ---------------------------------------------------------------------
  # A portable tarball for every other distribution, plus the Arch PKGBUILD.
  # ---------------------------------------------------------------------
  tarball:
    name: Portable tarball
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-4-dev libadwaita-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Assemble
        run: |
          set -euo pipefail
          # A manual dispatch has no tag, so fall back to a dev name.
          # Written as an if: `[ ... ] && x` returns non-zero when the test
          # fails, which trips `set -e`.
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${VERSION}" = "${GITHUB_REF_NAME}" ]; then
            VERSION="dev"
          fi
          STAGE="snatch-${VERSION}-x86_64-linux"
          mkdir -p "dist/${STAGE}"
          cp target/release/snatch-gui target/release/snatch-nmh "dist/${STAGE}/"
          cp -r extension install.sh README.md LICENSE "dist/${STAGE}/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          rm -rf "dist/${STAGE}"

      - uses: actions/upload-artifact@v4
        with:
          name: portable-tarball
          path: dist/*

  # ---------------------------------------------------------------------
  # Arch: build inside an Arch container so makepkg and the real dependency
  # names are available.
  # ---------------------------------------------------------------------
  arch:
    name: Arch package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed rust gtk4 libadwaita git sudo

      - name: Build with makepkg
        run: |
          set -euo pipefail
          # `makepkg -p` takes a filename in the current directory, not a
          # path, and the PKGBUILD expects $startdir to be the repo root.
          cp packaging/PKGBUILD ./PKGBUILD
          # makepkg refuses to run as root.
          useradd -m builder
          chown -R builder:builder .
          sudo -u builder makepkg -f --nodeps --noconfirm
        env:
          CARGO_TERM_COLOR: always

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: "*.pkg.tar.zst"

  publish:
    name: Attach to the release
    needs: [deb-rpm, tarball, arch]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # One checksum file covering every asset. Publishing a SHA256SUMS that
      # only listed the tarball was worse than none: it implies the packages
      # beside it were verified too.
      - name: Collect and checksum
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -exec cp -t release/ {} +
          cd release
          sha256sum -- * > SHA256SUMS
          echo "Release contains:"
          cat SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
