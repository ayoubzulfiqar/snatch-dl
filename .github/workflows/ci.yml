name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A CI failure should be a real failure, not a flaky network retry.
  CARGO_NET_RETRY: 3

jobs:
  check:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GTK4 and libadwaita are C libraries; the Rust bindings need their
      # headers and pkg-config files at build time.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-4-dev libadwaita-1-dev pkg-config

      # Optional at runtime, but the processor and archive tests exercise the
      # real binaries end to end; without these they skip themselves, which is
      # worse than it looks — the arguments they build would go unchecked.
      - name: Install test dependencies
        run: sudo apt-get install --no-install-recommends -y ffmpeg p7zip-full wget2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --release

      - name: Extension
        run: |
          node --check extension/background.js
          node --check extension/content.js
          python3 - <<'CHECK'
          import base64, hashlib, json, pathlib, re, sys

          path = pathlib.Path("extension/manifest.json")
          raw = path.read_text()
          manifest = json.loads(raw)
          problems = []

          # extension/ is loaded straight from the checkout with "Load
          # unpacked", so a missing member here is a silently broken
          # extension: it installs, shows as enabled, and does nothing.
          if manifest.get("manifest_version") != 3:
              problems.append("manifest_version must be 3")
          worker = manifest.get("background", {}).get("service_worker")
          if worker != "background.js":
              problems.append("background.service_worker must be background.js")
          if "scripts" in manifest.get("background", {}):
              problems.append("background.scripts is Firefox-only and Manifest V3 rejects it")

          # install.sh derives the Firefox manifest by replacing everything
          # above this line, and derives the extension id from the key.
          if not re.search(r'^\s*"manifest_version"', raw, re.M):
              problems.append('"manifest_version" must start its own line')
          key = manifest.get("key")
          if not key:
              problems.append('"key" is missing, so the id would not be stable')
          else:
              digest = hashlib.sha256(base64.b64decode(key)).hexdigest()[:32]
              ident = "".join(chr(ord("a") + int(c, 16)) for c in digest)
              print(f"extension id: {ident}")

          version = re.search(r'^version = "([^"]+)"', pathlib.Path("Cargo.toml").read_text(), re.M)
          if version and manifest.get("version") != version.group(1):
              problems.append(f"version {manifest.get('version')} != Cargo.toml {version.group(1)}")

          # Every file the manifest names must exist. A manifest pointing at a
          # missing script still installs and still shows as enabled; it just
          # does nothing, which is the hardest breakage to notice.
          named = set(manifest.get("icons", {}).values())
          named.update(manifest.get("action", {}).get("default_icon", {}).values())
          named.update(manifest["background"]["service_worker"] for _ in [0])
          for group in manifest.get("content_scripts", []):
              named.update(group.get("js", []))
          for group in manifest.get("web_accessible_resources", []):
              named.update(group.get("resources", []))
          absent = sorted(n for n in named if not (pathlib.Path("extension") / n).is_file())
          if absent:
              problems.append("names files that do not exist: " + ", ".join(absent))

          # ...and every script must be installed by every packaging path. The
          # icons were once added to the manifest but to only some of the
          # packages, so half the installs showed a letter placeholder.
          scripts = {manifest["background"]["service_worker"]}
          for group in manifest.get("content_scripts", []):
              scripts.update(group.get("js", []))
          for name in sorted(scripts):
              for packaging in ("snatch-gui/Cargo.toml", "packaging/PKGBUILD",
                                ".github/workflows/release.yml", "install.sh", "get.sh"):
                  if name not in pathlib.Path(packaging).read_text():
                      problems.append(f"{packaging} does not install extension/{name}")

          if problems:
              sys.exit("extension/manifest.json: " + "; ".join(problems))

          # The Firefox copy the packages ship must not drift from it. Only
          # the background member and the gecko id may differ; everything
          # else is the same extension.
          firefox = json.loads(pathlib.Path("packaging/extension-firefox/manifest.json").read_text())
          shared = {k: v for k, v in manifest.items() if k not in ("key", "background")}
          theirs = {k: v for k, v in firefox.items()
                    if k not in ("background", "browser_specific_settings")}
          if shared != theirs:
              differing = sorted(set(shared) ^ set(theirs)) or [
                  k for k in shared if shared.get(k) != theirs.get(k)]
              sys.exit("packaging/extension-firefox/manifest.json has drifted: " + ", ".join(differing))
          if "scripts" not in firefox.get("background", {}):
              sys.exit("the Firefox manifest needs background.scripts")
          if "key" in firefox:
              sys.exit("the Firefox manifest must not carry the Chromium key")

          # The version lives in five files and only one of them is built
          # from the others. A release went out with an Arch package still
          # named 3.6.10 because the PKGBUILD was the one that got missed,
          # and nothing noticed until the assets were listed.
          crate = re.search(r'^version = "([^"]+)"',
                            pathlib.Path("Cargo.toml").read_text(), re.M)
          if not crate:
              sys.exit("Cargo.toml has no workspace version")
          version = crate.group(1)

          pkgbuild = re.search(r'^pkgver=(\S+)',
                               pathlib.Path("packaging/PKGBUILD").read_text(), re.M)
          if not pkgbuild:
              sys.exit("packaging/PKGBUILD has no pkgver")

          for name, found in (("packaging/PKGBUILD", pkgbuild.group(1)),
                              ("extension/manifest.json", manifest.get("version")),
                              ("packaging/extension-firefox/manifest.json",
                               firefox.get("version"))):
              if found != version:
                  sys.exit(f"{name} says {found}, Cargo.toml says {version}")

          print(f"every packaged version says {version}")
          print("extension manifests agree and are loadable")
          CHECK

      - name: Installer syntax
        run: bash -n install.sh
