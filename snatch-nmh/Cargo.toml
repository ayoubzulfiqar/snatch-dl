[package]
name = "snatch-nmh"
description = "Native Messaging Host bridging the browser extension to the Snatch GUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "snatch-nmh"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-std", "io-util", "net", "time", "process"] }
