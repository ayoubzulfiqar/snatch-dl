[package]
name = "snatch-gui"
description = "GTK4/libadwaita front-end and aria2 orchestrator for Snatch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "snatch-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
dirs.workspace = true
env_logger.workspace = true
futures.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true

gtk4 = { version = "0.11", features = ["v4_12"] }
libadwaita = { version = "0.9", features = ["v1_5"] }

# rustls (not native-tls) so there is no OpenSSL build dependency; `socks`
# lets a download be routed through a SOCKS5 proxy by the ProxyManager.
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "socks",
  "rustls",
  # Trust the distribution's CA bundle rather than shipping our own.
  "rustls-native-certs",
] }

# Pure-Rust BitTorrent engine: DHT, ut_pex, magnet links, sequential streaming
# and SOCKS5 outbound, with no C toolchain required.
librqbit = { version = "9.0", default-features = false, features = ["rust-tls"] }

# `bundled` compiles SQLite from source, so there is no libsqlite3-dev to chase
# across distributions.
rusqlite = { version = "0.40", features = ["bundled"] }

url = "2.5"

# html5ever-backed HTML parsing with CSS selectors, for the media sniffer.
# A regex over markup would miss srcset, <base href> and relative URLs.
scraper = "0.27"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net", "time", "process", "sync", "fs", "signal"] }

# --- Debian / Ubuntu -------------------------------------------------------
# `cargo deb -p snatch-gui`
[package.metadata.deb]
name = "snatch-dl"
maintainer = "Ayoub Zulfiqar <ayoubzulfiqar3@gmail.com>"
copyright = "2026, Ayoub Zulfiqar"
license-file = ["../LICENSE", "0"]
extended-description = """\
Snatch is a download manager for Linux. HTTP and FTP transfers run through \
aria2 with segmented connections and resume; torrents run through a built-in \
librqbit session with DHT, peer exchange and sequential streaming; site video \
goes to yt-dlp and image galleries to gallery-dl. A browser extension captures \
downloads before the browser starts them."""
section = "net"
priority = "optional"
# gtk4/libadwaita are resolved by shlibs from the linked binary; aria2 is a
# runtime subprocess so it has to be named explicitly.
depends = "$auto, aria2"
# apt installs Recommends by default, so a plain `apt install snatch-dl`
# brings the whole feature set. They are not hard dependencies because each
# one only gates its own feature: Snatch runs without any of them.
recommends = "ffmpeg, yt-dlp, gallery-dl, wget2, p7zip-full"
assets = [
  ["../target/release/snatch-gui", "usr/bin/", "755"],
  ["../target/release/snatch-nmh", "usr/bin/", "755"],
  ["../packaging/com.snatch.dl.desktop", "usr/share/applications/", "644"],
  ["../README.md", "usr/share/doc/snatch-dl/README.md", "644"],
  ["../assets/icons/com.snatch.dl-16.png", "usr/share/icons/hicolor/16x16/apps/com.snatch.dl.png", "644"],
  ["../assets/icons/com.snatch.dl-24.png", "usr/share/icons/hicolor/24x24/apps/com.snatch.dl.png", "644"],
  ["../assets/icons/com.snatch.dl-32.png", "usr/share/icons/hicolor/32x32/apps/com.snatch.dl.png", "644"],
  ["../assets/icons/com.snatch.dl-48.png", "usr/share/icons/hicolor/48x48/apps/com.snatch.dl.png", "644"],
  ["../assets/icons/com.snatch.dl-64.png", "usr/share/icons/hicolor/64x64/apps/com.snatch.dl.png", "644"],
  ["../assets/icons/com.snatch.dl-96.png", "usr/share/icons/hicolor/96x96/apps/com.snatch.dl.png", "644"],
  ["../assets/icons/com.snatch.dl-128.png", "usr/share/icons/hicolor/128x128/apps/com.snatch.dl.png", "644"],
  ["../assets/icons/com.snatch.dl-256.png", "usr/share/icons/hicolor/256x256/apps/com.snatch.dl.png", "644"],
  ["../assets/icons/com.snatch.dl-512.png", "usr/share/icons/hicolor/512x512/apps/com.snatch.dl.png", "644"],
  ["../extension/manifest.json", "usr/share/snatch-dl/extension/", "644"],
  ["../extension/background.js", "usr/share/snatch-dl/extension/", "644"],
  # Registered for every user on the machine. The extension id is pinned by
  # the committed key, so these are static files rather than something an
  # install script has to generate.
  ["../packaging/native-messaging/chromium.json", "etc/opt/chrome/native-messaging-hosts/com.snatch.dl.nmh.json", "644"],
  ["../packaging/native-messaging/chromium.json", "etc/chromium/native-messaging-hosts/com.snatch.dl.nmh.json", "644"],
  ["../packaging/native-messaging/firefox.json", "usr/lib/mozilla/native-messaging-hosts/com.snatch.dl.nmh.json", "644"],
  # Firefox needs its own manifest -- Manifest V3 there has no service worker
  # -- but the same background script, installed from the one source copy.
  ["../packaging/extension-firefox/manifest.json", "usr/share/snatch-dl/extension-firefox/", "644"],
  # The licence the older, GPL-covered releases were under, kept for anyone
  # who still has one.
  ["../LICENSE-GPL-3.0.txt", "usr/share/doc/snatch-dl/LICENSE-GPL-3.0.txt", "644"],
  ["../extension/background.js", "usr/share/snatch-dl/extension-firefox/", "644"],
]

# --- Fedora / RHEL / openSUSE ---------------------------------------------
# `cargo generate-rpm -p snatch-gui`
[package.metadata.generate-rpm]
name = "snatch-dl"
summary = "Download manager for Linux with aria2, BitTorrent, yt-dlp and gallery-dl"
license = "LicenseRef-Snatch-Source-Available-1.0"
assets = [
  { source = "../target/release/snatch-gui", dest = "/usr/bin/snatch-gui", mode = "755" },
  { source = "../target/release/snatch-nmh", dest = "/usr/bin/snatch-nmh", mode = "755" },
  { source = "../packaging/com.snatch.dl.desktop", dest = "/usr/share/applications/com.snatch.dl.desktop", mode = "644" },
  { source = "../LICENSE", dest = "/usr/share/licenses/snatch-dl/LICENSE", mode = "644", doc = true },
  { source = "../LICENSE-GPL-3.0.txt", dest = "/usr/share/licenses/snatch-dl/LICENSE-GPL-3.0.txt", mode = "644", doc = true },
  { source = "../README.md", dest = "/usr/share/doc/snatch-dl/README.md", mode = "644", doc = true },
  { source = "../assets/icons/com.snatch.dl-16.png", dest = "/usr/share/icons/hicolor/16x16/apps/com.snatch.dl.png", mode = "644" },
  { source = "../assets/icons/com.snatch.dl-24.png", dest = "/usr/share/icons/hicolor/24x24/apps/com.snatch.dl.png", mode = "644" },
  { source = "../assets/icons/com.snatch.dl-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/com.snatch.dl.png", mode = "644" },
  { source = "../assets/icons/com.snatch.dl-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/com.snatch.dl.png", mode = "644" },
  { source = "../assets/icons/com.snatch.dl-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/com.snatch.dl.png", mode = "644" },
  { source = "../assets/icons/com.snatch.dl-96.png", dest = "/usr/share/icons/hicolor/96x96/apps/com.snatch.dl.png", mode = "644" },
  { source = "../assets/icons/com.snatch.dl-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/com.snatch.dl.png", mode = "644" },
  { source = "../assets/icons/com.snatch.dl-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/com.snatch.dl.png", mode = "644" },
  { source = "../assets/icons/com.snatch.dl-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/com.snatch.dl.png", mode = "644" },
  { source = "../extension/manifest.json", dest = "/usr/share/snatch-dl/extension/manifest.json", mode = "644" },
  { source = "../extension/background.js", dest = "/usr/share/snatch-dl/extension/background.js", mode = "644" },
  { source = "../packaging/native-messaging/chromium.json", dest = "/etc/opt/chrome/native-messaging-hosts/com.snatch.dl.nmh.json", mode = "644" },
  { source = "../packaging/native-messaging/chromium.json", dest = "/etc/chromium/native-messaging-hosts/com.snatch.dl.nmh.json", mode = "644" },
  { source = "../packaging/native-messaging/firefox.json", dest = "/usr/lib/mozilla/native-messaging-hosts/com.snatch.dl.nmh.json", mode = "644" },
  { source = "../packaging/extension-firefox/manifest.json", dest = "/usr/share/snatch-dl/extension-firefox/manifest.json", mode = "644" },
  { source = "../extension/background.js", dest = "/usr/share/snatch-dl/extension-firefox/background.js", mode = "644" },
]

[package.metadata.generate-rpm.requires]
aria2 = "*"
gtk4 = "*"
libadwaita = "*"

# Weak dependencies, installed by default by dnf but removable, and never
# able to make the package itself uninstallable. ffmpeg in particular is not
# in Fedora's own repositories, so a hard requirement would lock the package
# out of a stock install entirely.
[package.metadata.generate-rpm.recommends]
yt-dlp = "*"
p7zip = "*"
wget2 = "*"
